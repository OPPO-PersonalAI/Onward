  Embedded PDF viewer for Onward. Loaded via <iframe src="file://.../viewer.html?file=...&lang=...">.
  Theme follows the host window via postMessage (message type "onward:pdf:theme").
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onward PDF Reader</title>
    <link rel="stylesheet" href="../web/pdf_viewer.css" />
    <link rel="stylesheet" href="./viewer.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div class="toolbar-group">
          <span id="fileName" title=""></span>
        </div>

        <div class="toolbar-group">
          <button id="prevPageBtn" type="button" title="Previous page" data-i18n-title="prevPage">◀</button>
          <input id="pageNumberInput" type="number" min="1" value="1" />
          <span id="pageCountLabel">/ 0</span>
          <button id="nextPageBtn" type="button" title="Next page" data-i18n-title="nextPage">▶</button>
        </div>

        <div class="toolbar-group">
          <button id="zoomOutBtn" type="button" title="Zoom out" data-i18n-title="zoomOut">-</button>
          <select id="zoomSelect" title="Zoom level" data-i18n-title="zoom">
            <option value="page-width" data-i18n="fitWidth">Fit Width</option>
            <option value="page-fit" data-i18n="fitPage">Fit Page</option>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1">100%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
            <option value="3">300%</option>
            <option value="4">400%</option>
            <option id="customZoomOption" value="1" hidden>100%</option>
          </select>
          <!-- Free-form zoom. The preset list covers the common cases; this is
               for the reader who wants exactly 137% because that is what makes
               a two-column paper fit their window. -->
          <input
            id="customZoomInput"
            type="text"
            inputmode="decimal"
            value="100%"
            autocomplete="off"
            spellcheck="false"
            aria-invalid="false"
            data-i18n-title="customZoom"
            data-i18n-aria-label="customZoom"
            disabled
          />
          <button id="zoomInBtn" type="button" title="Zoom in" data-i18n-title="zoomIn">+</button>
        </div>

        <div class="toolbar-group grow">
          <input id="searchInput" type="search" placeholder="Search text (Enter for next)" data-i18n-placeholder="searchPlaceholder" />
          <button id="searchPrevBtn" type="button" title="Previous match" data-i18n-title="prevMatch">↑</button>
          <button id="searchNextBtn" type="button" title="Next match" data-i18n-title="nextMatch">↓</button>
          <span id="searchResult">0 / 0</span>
        </div>

        <div class="toolbar-group">
          <button id="colorToggleBtn" type="button" title="" data-i18n-title-on="colorToggleTitleOn" data-i18n-title-off="colorToggleTitleOff" data-i18n-on="colorToggleOn" data-i18n-off="colorToggleOff">Temporarily disable dark</button>
        </div>

        <!-- Annotation panel toggle. Lives in the toolbar rather than as a
             floating overlay button: the panel is a primary surface of this
             reader, and an icon hovering over the page was both easy to miss
             and visually detached from the controls it belongs with.
             `pinned` sticks it to the toolbar's right edge so it stays
             reachable when the rest of the toolbar has to scroll — the reader
             is routinely only ~350 px wide with the side panels open, and a
             toggle you have to scroll to find is the problem this replaced. -->
        <div class="toolbar-group pinned" id="annotationsToggleGroup" hidden>
          <button id="annotationsToggleBtn" type="button" aria-pressed="false" data-i18n-title="annotationsToggle" hidden>
            <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M2 3h12v2H2V3zm0 4h9v2H2V7zm0 4h12v2H2v-2z" />
            </svg>
            <span id="annotationsToggleLabel" data-i18n="annotationsToggle">Annotations</span>
            <span id="annotationsToggleCount" hidden>0</span>
          </button>
        </div>
      </header>

      <div id="errorBanner" hidden>
        <div id="errorMessage"></div>
        <div id="errorActions">
          <button id="errorCloseBtn" type="button" data-i18n="close">Close</button>
        </div>
      </div>

      <main id="workspace">
        <section id="viewerSection">
          <div id="viewerContainer">
            <div id="viewer" class="pdfViewer dark-invert"></div>
          </div>
          <!-- Appears next to the selection itself and is re-parented onto the
               page element so it scrolls with the content. A fixed toolbar was
               the earlier design; it lost because a colour picker parked at the
               screen edge makes the user leave the text they are reading. -->
          <div
            id="selectionHighlightPalette"
            class="selection-highlight-palette"
            role="toolbar"
            aria-label="Highlight the selected text"
            hidden
          ></div>
          <div id="emptyState" data-i18n="emptyState">No PDF loaded</div>
        </section>
      </main>
    </div>

    <!-- Note editor. Opened by double-clicking a highlight, or by clicking the
         ◆ marker on one that already has a note. Resizable; the size is
         persisted by the host. -->
    <div id="notePopup" hidden>
      <div id="notePopupHeader">
        <span id="notePopupLabel" class="note-label-badge"></span>
        <button id="noteDeleteBtn" type="button" data-i18n="noteDelete" data-i18n-title="noteDeleteTitle">Delete</button>
      </div>
      <div id="notePopupSnippet"></div>
      <textarea id="noteText" data-i18n-placeholder="notePlaceholder"></textarea>
      <div id="notePopupActions">
        <button id="noteCloseBtn" type="button" data-i18n="noteDone">Done</button>
      </div>
    </div>

    <!-- Hover affordance for a highlight that carries a note. Deliberately a
         short badge, not the note text: a large tooltip over the paragraph you
         are reading is worse than no tooltip at all. -->
    <div id="highlightHoverMarker" hidden aria-hidden="true"></div>

    <div id="passwordDialogBackdrop" hidden>
      <div id="passwordDialog" role="dialog" aria-modal="true" aria-labelledby="passwordDialogTitle">
        <h2 id="passwordDialogTitle" data-i18n="passwordTitle">Enter PDF password</h2>
        <p id="passwordPrompt" data-i18n="passwordPrompt">This PDF is encrypted. Please enter the password.</p>
        <input id="passwordInput" type="password" autocomplete="off" />
        <div class="dialog-actions">
          <button id="passwordCancelBtn" type="button" data-i18n="cancel">Cancel</button>
          <button id="passwordConfirmBtn" type="button" data-i18n="confirm">Confirm</button>
        </div>
      </div>
    </div>

    <script src="../build/pdf.js"></script>
    <script src="../web/pdf_viewer.js"></script>
    <script src="./outline-follow-core.js"></script>
    <script src="./text-selection-core.js"></script>
    <script src="./text-selection.js"></script>
    <script src="../vendor/pdf-lib.min.js"></script>
    <script src="./highlight-core.js"></script>
    <script src="./highlight.js"></script>
    <script src="./annotation-file.js"></script>
    <script src="./annotation-merge-core.js"></script>
    <script src="./annotation-store.js"></script>
    <script src="./reload-core.js"></script>
    <script src="./viewer.js"></script>
  </body>
</html>
